<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="CEjdeDxpo77LMmSzx4ou8gYqLO5wdv1t2XtyZh4OZ_k" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mathis Gomes</h1>
    </header>

    <div class="container">
        <h1 id="mainTitle">Contactez-moi</h1>
        
        <div class="content" style="max-width: 600px;">
            <p>Remplissez ce formulaire pour me contacter !</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Nom complet *</label>
                    <input type="text" id="name" name="name" placeholder="Nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="email@exemple.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" placeholder="Bonjour Mathis..." required></textarea>
                </div>

                <button type="submit" class="neon-button submit-btn">Envoyer le message</button>
            </form>

            <div id="formMessage"></div>
        </div>

        <div class="nav-button-container" style="margin-top: 30px;">
            <a href="index.html" class="neon-button nav-btn">Accueil</a>
            <a href="portfolio.html" class="neon-button nav-btn">Portfolio</a>
            <a href="cv.html" class="neon-button nav-btn">CV</a>
            <a href="experience.html" class="neon-button nav-btn">Expérience</a>
            <a href="veille.html" class="neon-button nav-btn">Veille</a>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            const subject = encodeURIComponent('Contact depuis le portfolio');
            const body = encodeURIComponent(
                `Nom: ${name}\n` +
                `Email: ${email}\n\n` +
                `Message:\n${message}`
            );
            
            window.location.href = `mailto:mathisgomes@proton.me?subject=${subject}&body=${body}`;

            const formMessage = document.getElementById('formMessage');
            formMessage.textContent = 'Votre client email va s\'ouvrir. Merci de votre message !';
            formMessage.className = 'success';

            setTimeout(() => {
                document.getElementById('contactForm').reset();
                formMessage.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
