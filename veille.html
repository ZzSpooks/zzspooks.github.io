<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veille Numérique - Mathis Gomes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="jpeg" href="icone.jpg">
    <style>
        /* Styles repris du portfolio pour maintenir la cohérence */
        .portfolio-section {
            margin: 40px 0;
            text-align: left;
        }

        .portfolio-section h2 {
            color: #00d9ff;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .project-card {
            background: rgba(0, 217, 255, 0.05);
            padding: 25px;
            border: 2px solid #00d9ff;
            border-radius: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-card:hover {
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.5);
            transform: translateY(-5px);
        }

        .project-card h3 {
            color: #00d9ff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #00d9ff;
            line-height: 1.4;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .tech-tag {
            background: rgba(0, 217, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            text-decoration: none;
            transition: all 0.2s;
        }

        .tech-tag.link-btn {
            color: #fff;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .tech-tag.link-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .date-tag {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: block;
            font-style: italic;
        }

        .loader-container {
            text-align: center;
            padding: 40px;
            color: #00d9ff;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #00d9ff;
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mathis Gomes</h1>
    </header>

    <div class="container">
        <h1 id="mainTitle">Veille Technologique</h1>
        
        <div class="content portfolio-section" id="mainContent">
            <h2>Actualités Dev & Cybersécurité</h2>
            <p>
                Retrouvez ici ma sélection automatisée des dernières alertes de sécurité et des nouveautés en développement.
            </p>
            
            <!-- Message de chargement -->
            <div id="loading" class="loader-container">Extraction des flux RSS en cours...</div>
            
            <!-- Grille où les articles seront injectés -->
            <div id="news-grid" class="projects-grid"></div>
        </div>

        <div class="nav-button-container" style="margin-top: 30px;">
            <a href="index.html" class="neon-button nav-btn">Accueil</a>
            <a href="portfolio.html" class="neon-button nav-btn">Portfolio</a>
            <a href="cv.html" class="neon-button nav-btn">CV</a>
            <a href="experience.html" class="neon-button nav-btn">Expérience</a>
            <a href="contact.html" class="neon-button nav-btn">Contact</a>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        // API RSS vers JSON (nécessaire pour contourner les blocages CORS sur les sites statiques)
        const rss2jsonUrl = 'https://api.rss2json.com/v1/api.json?rss_url=';
        
        // Sources de la veille
        const feeds = [
            { url: 'https://www.cert.ssi.gouv.fr/alerte/feed/', category: 'Cybersécurité' }, // Alertes ANSSI
            { url: 'https://www.developpez.com/index/rss', category: 'Développement' } // Actus Dev
        ];

        async function fetchVeille() {
            const grid = document.getElementById('news-grid');
            const loader = document.getElementById('loading');
            let allArticles = [];

            try {
                for (const feed of feeds) {
                    const response = await fetch(rss2jsonUrl + encodeURIComponent(feed.url));
                    const data = await response.json();
                    
                    if (data.status === 'ok') {
                        // Récupère les 4 articles les plus récents de chaque source
                        const items = data.items.slice(0, 4).map(item => ({
                            title: item.title,
                            link: item.link,
                            pubDate: item.pubDate,
                            category: feed.category
                        }));
                        allArticles = allArticles.concat(items);
                    }
                }

                // Trie tous les articles par date de publication (du plus récent au plus ancien)
                allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                loader.style.display = 'none'; // Masquer le loader

                // Injecter le code HTML pour chaque article
                allArticles.forEach(article => {
                    const dateObj = new Date(article.pubDate);
                    const formattedDate = dateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
                    
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.innerHTML = `
                        <div>
                            <span class="date-tag">Publié le ${formattedDate}</span>
                            <h3>${article.title}</h3>
                        </div>
                        <div class="project-tech">
                            <span class="tech-tag">${article.category}</span>
                            <a href="${article.link}" target="_blank" class="tech-tag link-btn">Lire l'article ➔</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Erreur lors de la récupération des flux RSS:', error);
                loader.innerHTML = "Impossible de charger les actualités pour le moment. Vérifiez votre connexion.";
            }
        }

        // Lancer la fonction au chargement de la page
        document.addEventListener('DOMContentLoaded', fetchVeille);
    </script>
</body>
</html>
